name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate Chimpion GLBs
        run: bash scripts/fetch-models.sh
      - name: Inspect Chimpion rigs
        run: node scripts/inspect-models.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
